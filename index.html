<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight Routes - Airport Connections</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Flight Route Network</h1>
            <p>Origin airport in red, destinations in green, with flight paths connecting them</p>
        </header>
        
        <div class="content">
            <div class="airport-list-container">
                <h3>Airport List</h3>
                <ul id="airport-list" class="airport-list">
                    <!-- Airport list will be populated by JavaScript -->
                </ul>
            </div>
            
            <div class="map-container">
                <div id="map"></div>
            </div>
        </div>
    </div>

    <script src="airports-data2.js"></script>
    <script src="script.js"></script>
    <!-- Replace YOUR_API_KEY with your actual Google Maps API key -->
    <script async defer
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDid58dkDO2xVTVfc997hBAS5KTdgS42XI&callback=initMap">
    </script>
</body>
</html>
