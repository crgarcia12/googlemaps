<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight Routes - Airport Connections</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Reservar Vuelo</h1>
            <p>Origin airport in red, destinations in green, with flight paths connecting them</p>
        </header>
        
        <div class="content">
            <div class="airport-list-container">
                <h3 class="section-title">1. Aeronave Seleccionada</h3>
                
                <div class="aircraft-section">
                    <div class="aircraft-image-container">
                        <img src="https://sur-air.com/img/flota/LV-MEC.jpg" alt="Aeronave Seleccionada" class="aircraft-image">
                        <div class="aircraft-info">
                            <h4>LV-MEC</h4>
                            <p>Beechcraft King Air 350</p>
                        </div>
                    </div>
                    
                    <div class="aircraft-status-container">
                        <h4>Estado de la Aeronave</h4>
                        <div class="status-item">
                            <label>Landing Gear</label>
                            <div class="progress-bar">
                                <div class="progress-fill" data-percentage="90"></div>
                                <span class="progress-text">90%</span>
                            </div>
                        </div>
                        <div class="status-item">
                            <label>Engine</label>
                            <div class="progress-bar">
                                <div class="progress-fill" data-percentage="70"></div>
                                <span class="progress-text">70%</span>
                            </div>
                        </div>
                        <div class="status-item">
                            <label>Fuel Level</label>
                            <div class="progress-bar">
                                <div class="progress-fill" data-percentage="85"></div>
                                <span class="progress-text">85%</span>
                            </div>
                        </div>
                        <div class="status-item">
                            <label>Hydraulics</label>
                            <div class="progress-bar">
                                <div class="progress-fill" data-percentage="95"></div>
                                <span class="progress-text">95%</span>
                            </div>
                        </div>
                    </div>
                </div>
                
                <h3 class="section-title">2. Destinos disponibles en la aeronave seleccionada</h3>
                <table id="airport-table" class="airport-table">
                    <tbody id="airport-list">
                        <!-- Airport routes will be populated by JavaScript -->
                    </tbody>
                </table>
            </div>
            
            <div class="map-container">
                <div id="map"></div>
            </div>
        </div>
    </div>

    <script src="airports-data2.js"></script>
    <script src="script.js"></script>
    <!-- Replace YOUR_API_KEY with your actual Google Maps API key -->
    <script async defer
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDid58dkDO2xVTVfc997hBAS5KTdgS42XI&callback=initMap">
    </script>
</body>
</html>
